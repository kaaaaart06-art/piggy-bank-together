<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabungan Bersama - Piggy Bank Together</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #f5f5f5; max-width: 480px; margin: 0 auto; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 14px; margin-bottom: 16px; }
    .progress-bg { background: #333; height: 20px; border-radius: 10px; overflow: hidden; margin: 12px 0; }
    .progress-fill { background: #4ade80; height: 100%; width: 0%; transition: width 0.4s ease; }
    input, select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; box-sizing: border-box; font-size: 15px; }
    input, select { background: #2c2c2c; color: #fff; }
    button { background: #4ade80; color: #000; font-weight: bold; cursor: pointer; }
    button.secondary { background: #3f3f46; color: #f5f5f5; }
    .history-item { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 10px 0; font-size: 14px; }
    details { margin-top: 12px; }
    summary { cursor: pointer; color: #a1a1aa; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="judulTarget">Target Tabungan Bersama</h2>
    <h1 id="totalTerkumpul">Rp 0</h1>
    <p>Dari target: <strong id="nominalTarget">Rp 5.000.000</strong> (<span id="persen">0%</span>)</p>
    <div class="progress-bg">
      <div class="progress-fill" id="progressBar"></div>
    </div>

    <details>
      <summary>Edit Nama & Target Tabungan</summary>
      <input type="text" id="inputJudulBaru" placeholder="Nama target baru (contoh: Liburan / Gitar)">
      <input type="number" id="inputTargetBaru" placeholder="Nominal target baru (contoh: 2500000)">
      <button type="button" class="secondary" onclick="updatePengaturanTarget()">Simpan Perubahan Target</button>
    </details>
  </div>

  <div class="card">
    <h3>Tambah Tabungan</h3>
    <select id="penyetor">
      <option value="Rafka">Rafka</option>
      <option value="Partner">Partner</option>
    </select>
    <input type="number" id="nominal" placeholder="Nominal (contoh: 50000)">
    <input type="text" id="catatan" placeholder="Catatan (opsional)">
    <button type="button" onclick="tambahTabungan()">Simpan ke Tabungan</button>
  </div>

  <div class="card">
    <h3>Riwayat Setoran</h3>
    <div id="listRiwayat"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDda7ZG9dYCzLhMRZG8NmwhV4wrMgy0Cms",
      authDomain: "piggy-bank-together.firebaseapp.com",
      databaseURL: "https://piggy-bank-together-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "piggy-bank-together",
      storageBucket: "piggy-bank-together.firebasestorage.app",
      messagingSenderId: "663281994666",
      appId: "1:663281994666:web:e7866e47629158f16879d3",
      measurementId: "G-9Z2H9MWX5D"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const transaksiRef = db.ref('tabungan_bersama/transaksi');
    const targetRef = db.ref('tabungan_bersama/target');
    const judulRef = db.ref('tabungan_bersama/judul');

    let currentJudul = "Target Tabungan Bersama";
    let currentTarget = 5000000;
    let currentTotal = 0;

    function renderProgress() {
      const safeTarget = currentTarget > 0 ? currentTarget : 5000000;
      const persen = Math.min((currentTotal / safeTarget) * 100, 100).toFixed(1);
      document.getElementById('judulTarget').innerText = currentJudul;
      document.getElementById('nominalTarget').innerText = "Rp " + safeTarget.toLocaleString('id-ID');
      document.getElementById('totalTerkumpul').innerText = "Rp " + currentTotal.toLocaleString('id-ID');
      document.getElementById('persen').innerText = persen + "%";
      document.getElementById('progressBar').style.width = persen + "%";
    }

    function updatePengaturanTarget() {
      const judulBaru = document.getElementById('inputJudulBaru').value.trim();
      const targetBaruRaw = document.getElementById('inputTargetBaru').value.trim();
      const tasks = [];

      if (judulBaru) {
        tasks.push(judulRef.set(judulBaru));
      }

      if (targetBaruRaw) {
        const targetAngka = parseInt(targetBaruRaw, 10);
        if (!targetAngka || targetAngka <= 0) {
          alert("Masukkan nominal target yang valid!");
          return;
        }
        tasks.push(targetRef.set(targetAngka));
      }

      if (tasks.length === 0) {
        alert("Isi nama target atau nominal target baru terlebih dahulu!");
        return;
      }

      Promise.all(tasks).then(() => {
        document.getElementById('inputJudulBaru').value = '';
        document.getElementById('inputTargetBaru').value = '';
      }).catch((err) => {
        alert("Gagal menyimpan perubahan: " + err.message);
      });
    }

    function tambahTabungan() {
      const nama = document.getElementById('penyetor').value;
      const jumlah = parseInt(document.getElementById('nominal').value, 10);
      const catatan = document.getElementById('catatan').value || "-";

      if (!jumlah || jumlah <= 0) {
        alert("Masukkan nominal yang valid!");
        return;
      }

      transaksiRef.push({
        nama: nama,
        jumlah: jumlah,
        catatan: catatan,
        waktu: new Date().toLocaleDateString('id-ID')
      }).then(() => {
        document.getElementById('nominal').value = '';
        document.getElementById('catatan').value = '';
      }).catch((err) => {
        alert("Gagal menyimpan: " + err.message);
      });
    }

    judulRef.on('value', (snapshot) => {
      const val = snapshot.val();
      currentJudul = (val && String(val).trim()) ? String(val).trim() : "Target Tabungan Bersama";
      renderProgress();
    });

    targetRef.on('value', (snapshot) => {
      const val = snapshot.val();
      currentTarget = (val && Number(val) > 0) ? Number(val) : 5000000;
      renderProgress();
    });

    transaksiRef.on('value', (snapshot) => {
      const data = snapshot.val();
      let total = 0;
      const listEl = document.getElementById('listRiwayat');
      listEl.innerHTML = '';

      if (data) {
        Object.values(data).reverse().forEach((item) => {
          const nilai = Number(item.jumlah) || 0;
          total += nilai;
          listEl.innerHTML += `
            <div class="history-item">
              <div><strong>${item.nama}</strong> (${item.waktu})<br><small>${item.catatan}</small></div>
              <div style="color:#4ade80;">+Rp ${nilai.toLocaleString('id-ID')}</div>
            </div>
          `;
        });
      }

      currentTotal = total;
      renderProgress();
    });
  </script>
</body>
</html>
